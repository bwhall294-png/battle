<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lake Fight Royale Online</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel" id="arcadePanel">
        <h1>Game Portal</h1>
        <p>Play instantly in the popup player, open in a new tab, or go fullscreen.</p>
        <div class="actions">
          <button type="button" disabled>🎮 Instant Play</button>
          <button type="button" disabled>🖥️ Fullscreen Ready</button>
          <button type="button" disabled>↗ New Tab Fallback</button>
        </div>
        <div class="game-grid" id="gameGrid"></div>
      </section>

      <section class="panel" id="lobbyPanel">
        <h1>Lake Fight Royale Online</h1>
        <p>Play with friends: create a room or join with a code.</p>

        <div class="form-row">
          <label for="nameInput">Name</label>
          <input id="nameInput" maxlength="16" placeholder="Player" />
        </div>

        <div class="form-row">
          <label for="codeInput">Room code</label>
          <input id="codeInput" maxlength="5" placeholder="ABCDE" />
        </div>

        <div class="actions">
          <button id="createBtn">Create Room</button>
          <button id="joinBtn">Join Room</button>
          <button id="refreshBtn">Refresh Rooms</button>
        </div>

        <h2>Open Rooms</h2>
        <ul id="roomsList"></ul>

        <p id="lobbyStatus"></p>
      </section>

      <section class="panel hidden" id="gamePanel">
        <div class="topbar">
          <div id="status"></div>
          <div>1 Rifle • 2 Shotgun • 3 SMG</div>
        </div>
        <canvas id="game" width="1100" height="700" aria-label="Online lake arena"></canvas>
      </section>
    </main>

    <div class="modal hidden" id="gameModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-content">
        <div class="modal-topbar">
          <h2 id="modalTitle">Game</h2>
          <div class="actions">
            <button id="newTabBtn">Open in New Tab</button>
            <button id="fullscreenBtn">Fullscreen</button>
            <button id="closeModalBtn">Close</button>
          </div>
        </div>
        <iframe id="gameFrame" title="Game player" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
